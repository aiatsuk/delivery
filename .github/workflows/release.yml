name: Release delivery

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.4.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check versions and changelog
        run: python3 -S -B tools/release.py check --tag "$TAG"
      - run: make check
      - run: make test
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          python3 -S -B tools/release.py notes --tag "$TAG" > "$notes"
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --verify-tag --title "Delivery ${VERSION}" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --title "Delivery ${VERSION}" --notes-file "$notes"
          fi
